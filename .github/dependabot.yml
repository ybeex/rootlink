version: 2
updates:
  # Root + all npm workspaces (apps/*, packages/*) are covered by a single
  # root-anchored entry since this is an npm-workspaces monorepo — Dependabot
  # resolves the workspace graph from the root package.json/package-lock.json.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Patch/minor bumps for well-established, low-risk infra packages are
      # batched into one PR per week rather than one PR per package.
      backend-infra-patch:
        patterns:
          - "fastify"
          - "@fastify/*"
          - "drizzle-orm"
          - "drizzle-kit"
          - "bullmq"
          - "ioredis"
        update-types:
          - "patch"
          - "minor"
      frontend-infra-patch:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@tanstack/*"
        update-types:
          - "patch"
          - "minor"
    # Security-relevant auth/crypto packages always get their own PR, never
    # batched, so each one gets individual review attention.
    ignore:
      - dependency-name: "argon2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsonwebtoken"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
